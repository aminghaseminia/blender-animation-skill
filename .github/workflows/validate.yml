name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill frontmatter, links, and structure
        run: python3 scripts/validate_skills.py

      - name: Compile Python helpers
        run: python3 -m compileall -q skills scripts

      - name: Check shell syntax
        run: |
          bash -n install.sh
          for f in $(find skills -name '*.sh'); do
            echo "checking $f"
            bash -n "$f"
          done

      - name: Doctor smoke test
        run: python3 skills/motion-studio/scripts/doctor.py --json > /dev/null

      - name: Installer smoke test
        run: |
          ./install.sh --target "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/motion-studio/SKILL.md"
          test -f "$RUNNER_TEMP/skills/blender-animation/SKILL.md"
